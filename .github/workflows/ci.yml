name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Pipeline smoke test (Base-22 extraction + analysis)
        run: |
          python master_command_64.py
          python arch_detective.py
          python divine_disassembler.py
          python function_miner.py
          python genesis_runner.py
          python future_scan.py
          python null_hypothesis.py --trials 2
